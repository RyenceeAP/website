<!doctype html>
<html lang="en-CA" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The decrypted tools open in a sandboxed blob: frame, which inherits this policy, so it allows what the tools load too:
     their inline scripts and styles, SheetJS (jsDelivr), pdf.js and its worker (cdnjs, blob:) and IBM Plex (Google Fonts).
     connect-src is this site (for ap-tools.enc), its Supabase project and blob: addresses (data the page itself made, which is how the PDF Reader's
     OCR worker gets its language data), so nothing on the page can send data anywhere else with fetch. 'wasm-unsafe-eval' lets the OCR engine
     (WebAssembly) compile; it does not allow eval() or new Function(). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' blob: https://djjtshpbxlypoezeylcq.supabase.co; frame-src blob:; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>AP Tools | Primexx Consulting</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/account/account.css">
<!-- The guard runs first: no session, no page. The tools themselves are not in this file. -->
<script type="module" src="/account/guard.js"></script>
<script type="module" src="/account/tools.js"></script>
</head>
<body class="app">
<header class="strip">
  <span class="who" id="who"></span>
  <button class="link" type="button" id="out">Sign out</button>
</header>
<main class="card" id="panel" hidden>
  <h1 id="pTitle">AP Tools</h1>
  <p class="lede" id="pText"></p>
  <button class="btn btn-primary" type="button" id="pGo" hidden></button>
  <label class="fld" for="pKey" id="pKeyRow" hidden>Your public key (safe to share)
    <textarea id="pKey" rows="7" readonly spellcheck="false"></textarea>
  </label>
  <button class="btn btn-quiet" type="button" id="pCopy" hidden>Copy public key</button>
  <p class="msg" id="pMsg" role="status" aria-live="polite"></p>
</main>
<div class="frame" id="frame"></div>
<noscript><p class="msg bad">This page needs JavaScript.</p></noscript>
</body>
</html>
