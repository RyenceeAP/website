<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.supabase.co https://cdn.jsdelivr.net; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Choose a new password | Ryan Carrillo</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/account/account.css">
<script type="module" src="/account/reset.js"></script>
</head>
<body>
<main class="card">
  <a class="name" href="/">Ryan Carrillo <span>&nbsp;Accounts payable</span></a>
  <h1>Choose a new password</h1>
  <p class="lede" id="lede">Checking your reset link…</p>

  <form id="form" method="post" novalidate hidden>
    <label class="fld" for="password">New password
      <input id="password" name="password" type="password" autocomplete="new-password" maxlength="72" required>
    </label>
    <label class="fld" for="password2">New password again
      <input id="password2" name="password2" type="password" autocomplete="new-password" maxlength="72" required>
    </label>
    <p class="hint">At least 12 characters, with a letter and a number.</p>
    <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
    <button class="btn btn-primary" type="submit" id="go">Save new password</button>
  </form>

  <p class="links"><a class="link" href="/login.html">Back to sign in</a></p>
  <noscript><p class="msg bad">This page needs JavaScript.</p></noscript>
</main>
</body>
</html>
